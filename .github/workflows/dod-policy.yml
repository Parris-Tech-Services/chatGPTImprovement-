name: Definition of Done policy tests
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/ACTION_APPROVAL_POLICY_V1.md'
      - 'docs/DEFINITION_OF_DONE_V1.md'
      - 'docs/evidence/**'
      - 'docs/MASTER_ACTION_BACKLOG_2026-10-29.csv'
      - '.github/workflows/dod-policy.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/ACTION_APPROVAL_POLICY_V1.md'
      - 'docs/DEFINITION_OF_DONE_V1.md'
      - 'docs/evidence/**'
      - 'docs/MASTER_ACTION_BACKLOG_2026-10-29.csv'
      - '.github/workflows/dod-policy.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run negative acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Reject malformed task evidence, self-reported DONE and drifted contracts
        shell: bash
        run: |
          for record in docs/evidence/*.json; do
            python scripts/check_task_record.py "$record"
          done
      - name: Fail if a VERIFIED claim lacks a valid record or omits authorisation
        run: python scripts/kpi_ledger.py
      - name: Syntax compilation
        run: python -m compileall -q scripts tests
