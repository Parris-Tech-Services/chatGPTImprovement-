name: Definition of Done policy tests
on:
  push:
    paths:
      - 'scripts/check_task_record.py'
      - 'tests/test_status_policy.py'
      - 'docs/DEFINITION_OF_DONE_V1.md'
      - '.github/workflows/dod-policy.yml'
  pull_request:
    paths:
      - 'scripts/check_task_record.py'
      - 'tests/test_status_policy.py'
      - 'docs/DEFINITION_OF_DONE_V1.md'
      - '.github/workflows/dod-policy.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run negative acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Syntax compilation
        run: python -m compileall -q scripts tests
